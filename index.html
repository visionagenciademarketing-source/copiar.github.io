<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Copiar datos del producto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 550px;
      margin: 25px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow:
        0 4px 20px
        rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      font-size: 23px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .estado-general {
      text-align: center;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #f1f3f5;
      color: #555;
      font-size: 15px;
    }

    .campo {
      margin-bottom: 18px;
      padding: 18px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e1e4e8;
    }

    .titulo {
      font-size: 14px;
      font-weight: bold;
      color: #666;
      margin-bottom: 8px;
    }

    .valor {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
      word-wrap: break-word;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button.copiado {
      background: #2e7d32;
      cursor: default;
    }

    button.error {
      background: #c62828;
    }

    .total {
      text-align: center;
      margin-top: 5px;
      padding: 15px;
      background: #fff8e1;
      border-radius: 10px;
      font-size: 16px;
    }

    .volver {
      margin-top: 20px;
      background: #555;
    }

  </style>

</head>

<body>

  <div class="container">

    <h1>
      📋 Copiar datos del producto
    </h1>


    <div
      id="estadoGeneral"
      class="estado-general"
    >
      Selecciona el dato que quieres copiar.
    </div>



    <!-- =====================================================
         DESCRIPCIÓN
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        📦 DESCRIPCIÓN
      </div>

      <div
        class="valor"
        id="descripcion"
      >
        -
      </div>

      <button
        id="btnDescripcion"
        onclick="copiarDato(
          'descripcion',
          'btnDescripcion',
          'Descripción'
        )"
      >
        📋 COPIAR DESCRIPCIÓN
      </button>

    </div>



    <!-- =====================================================
         CANTIDAD
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        🔢 CANTIDAD
      </div>

      <div
        class="valor"
        id="cantidad"
      >
        -
      </div>

      <button
        id="btnCantidad"
        onclick="copiarDato(
          'cantidad',
          'btnCantidad',
          'Cantidad'
        )"
      >
        📋 COPIAR CANTIDAD
      </button>

    </div>




    <!-- =====================================================
         UNIDAD DE MEDIDA
         ESTA SECCIÓN SE OCULTARÁ SI ES "UNIDAD"
         ===================================================== -->

    <div
      class="campo"
      id="campoUnidad"
    >

      <div class="titulo">
        📏 UNIDAD DE MEDIDA
      </div>

      <div
        class="valor"
        id="unidad"
      >
        -
      </div>

      <button
        id="btnUnidad"
        onclick="copiarDato(
          'unidad',
          'btnUnidad',
          'Unidad de medida'
        )"
      >
        📋 COPIAR UNIDAD
      </button>

    </div>


    <!-- =====================================================
         PRECIO
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        💰 PRECIO UNITARIO
      </div>

      <div
        class="valor"
        id="precio"
      >
        -
      </div>

      <button
        id="btnPrecio"
        onclick="copiarDato(
          'precio',
          'btnPrecio',
          'Precio unitario'
        )"
      >
        📋 COPIAR PRECIO
      </button>

    </div>



    <!-- =====================================================
         SUBTOTAL
         ===================================================== -->

    <div class="total">

      Total de la línea:

      <strong id="subtotal">
        S/ 0.00
      </strong>

    </div>

  </div>



  <script>

    // =========================================================
    // RECIBIR DATOS DE APPSHEET
    // =========================================================

    const parametros =
      new URLSearchParams(
        window.location.search
      );

    const descripcion =
      parametros.get("descripcion") || "";

    const cantidad =
      parametros.get("cantidad") || "";

    const precio =
      parametros.get("precio") || "";

    const unidad =
      parametros.get("unidad") || "";

    const subtotal =
      parametros.get("subtotal") || "";


    // =========================================================
    // MOSTRAR DATOS
    // =========================================================

    document
      .getElementById("descripcion")
      .textContent =
      descripcion || "Sin descripción";


    document
      .getElementById("cantidad")
      .textContent =
      cantidad || "Sin cantidad";


    document
      .getElementById("unidad")
      .textContent =
      unidad || "Sin unidad";


    // =========================================================
    // OCULTAR COMPLETAMENTE LA UNIDAD
    // SI APPSHEET ENVÍA "UNIDAD"
    // =========================================================

    const campoUnidad =
      document.getElementById("campoUnidad");


    if (
      unidad.trim().toUpperCase() === "UNIDAD"
    ) {

      campoUnidad.style.display = "none";

    }


    // =========================================================
    // MOSTRAR PRECIO
    // =========================================================

    document
      .getElementById("precio")
      .textContent =
      precio
        ? "S/ " + formatearPrecio(precio)
        : "Sin precio";


    // =========================================================
    // MOSTRAR SUBTOTAL
    // =========================================================

    document
      .getElementById("subtotal")
      .textContent =
      subtotal
        ? "S/ " + formatearPrecio(subtotal)
        : "S/ 0.00";



    // =========================================================
    // FORMATO DE PRECIO
    // =========================================================

    function formatearPrecio(valor) {

      const numero =
        Number(
          String(valor)
            .replace(",", ".")
        );

      if (isNaN(numero)) {
        return valor;
      }

      return numero.toFixed(2);

    }



    // =========================================================
    // COPIAR DATO
    // =========================================================

    async function copiarDato(
      tipo,
      botonId,
      nombreDato
    ) {

      let contenido = "";


      // -------------------------------------------------------
      // BLOQUEAR COPIA DE "UNIDAD"
      // -------------------------------------------------------

      if (
        tipo === "unidad" &&
        unidad.trim().toUpperCase() === "UNIDAD"
      ) {

        return;

      }


      // -------------------------------------------------------
      // DESCRIPCIÓN
      // -------------------------------------------------------

      if (tipo === "descripcion") {

        contenido = descripcion;

      }


      // -------------------------------------------------------
      // CANTIDAD
      // -------------------------------------------------------

      if (tipo === "cantidad") {

        contenido = cantidad;

      }


      // -------------------------------------------------------
      // UNIDAD
      // -------------------------------------------------------

      if (tipo === "unidad") {

        if (
          unidad.trim().toUpperCase() === "UNIDAD"
        ) {

          return;

        }

        contenido = unidad;

      }


      // -------------------------------------------------------
      // PRECIO
      // -------------------------------------------------------

      if (tipo === "precio") {

        contenido =
          formatearPrecio(precio);

      }


      // -------------------------------------------------------
      // VALIDAR
      // -------------------------------------------------------

      if (!contenido.trim()) {

        mostrarError(
          "No hay información para copiar."
        );

        return;

      }


      const boton =
        document.getElementById(
          botonId
        );


      // -------------------------------------------------------
      // EVITAR SEGUNDA COPIA
      // -------------------------------------------------------

      if (
        boton.classList.contains(
          "copiado"
        )
      ) {

        return;

      }


      // =======================================================
      // MÉTODO PRINCIPAL
      // =======================================================

      try {

        await navigator.clipboard.writeText(
          contenido
        );


        marcarComoCopiado(
          boton,
          nombreDato
        );

        return;

      }

      catch (error) {

        console.log(
          "Clipboard API:",
          error
        );

      }


      // =======================================================
      // MÉTODO ALTERNATIVO
      // =======================================================

      try {

        const textarea =
          document.createElement(
            "textarea"
          );

        textarea.value =
          contenido;

        textarea.style.position =
          "fixed";

        textarea.style.left =
          "-9999px";

        document
          .body
          .appendChild(
            textarea
          );

        textarea.focus();

        textarea.select();


        const resultado =
          document.execCommand(
            "copy"
          );


        document
          .body
          .removeChild(
            textarea
          );


        if (resultado) {

          marcarComoCopiado(
            boton,
            nombreDato
          );

        }

        else {

          mostrarError(
            "El navegador no permitió copiar " +
            nombreDato +
            "."
          );

        }

      }

      catch (error) {

        mostrarError(
          "No se pudo copiar " +
          nombreDato +
          "."
        );

      }

    }



    // =========================================================
    // MARCAR COMO COPIADO
    // =========================================================

    function marcarComoCopiado(
      boton,
      nombreDato
    ) {

      boton.textContent =
        "✅ COPIADO";


      boton.classList.add(
        "copiado"
      );


      boton.disabled =
        true;


      const estado =
        document.getElementById(
          "estadoGeneral"
        );


      estado.textContent =
        "✅ " +
        nombreDato +
        " copiado correctamente.";


      estado.style.background =
        "#dff6e5";


      estado.style.color =
        "#137333";

    }



    // =========================================================
    // ERROR
    // =========================================================

    function mostrarError(
      mensaje
    ) {

      const estado =
        document.getElementById(
          "estadoGeneral"
        );


      estado.textContent =
        "❌ " +
        mensaje;


      estado.style.background =
        "#fde7e9";


      estado.style.color =
        "#b3261e";

    }

  </script>

</body>

</html>
