<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Copiar datos del producto</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;

      color: #222;

    }


    .container {

      max-width: 550px;

      margin: 25px auto;

      background: white;

      border-radius: 18px;

      padding: 25px;

      box-shadow:
        0 4px 20px
        rgba(0,0,0,0.10);

    }


    h1 {

      text-align: center;

      font-size: 23px;

      margin-top: 0;

      margin-bottom: 25px;

    }


    .estado-general {

      text-align: center;

      padding: 12px;

      margin-bottom: 20px;

      border-radius: 10px;

      background: #f1f3f5;

      color: #555;

      font-size: 15px;

    }


    .campo {

      margin-bottom: 18px;

      padding: 18px;

      background: #f8f9fa;

      border-radius: 12px;

      border: 1px solid #e1e4e8;

    }


    .titulo {

      font-size: 14px;

      font-weight: bold;

      color: #666;

      margin-bottom: 8px;

    }


    .valor {

      font-size: 19px;

      font-weight: bold;

      margin-bottom: 14px;

      word-wrap: break-word;

    }


    button {

      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 9px;

      background: #1976d2;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }


    button:active {

      transform: scale(0.98);

    }


    button.copiado {

      background: #2e7d32;

      cursor: default;

    }


    .total {

      text-align: center;

      margin-top: 5px;

      padding: 15px;

      background: #fff8e1;

      border-radius: 10px;

      font-size: 16px;

    }

  </style>

</head>



<body>


  <div class="container">


    <h1>
      📋 Copiar datos del producto
    </h1>


    <div
      id="estadoGeneral"
      class="estado-general"
    >
      Selecciona el dato que quieres copiar.
    </div>



    <!-- =====================================================
         DESCRIPCIÓN
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        📦 DESCRIPCIÓN
      </div>

      <div
        class="valor"
        id="descripcion"
      >
        -
      </div>

      <button
        id="btnDescripcion"
        onclick="copiarDato(
          'descripcion',
          'btnDescripcion',
          'Descripción'
        )"
      >
        📋 COPIAR DESCRIPCIÓN
      </button>

    </div>



    <!-- =====================================================
         CANTIDAD
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        🔢 CANTIDAD
      </div>

      <div
        class="valor"
        id="cantidad"
      >
        -
      </div>

      <button
        id="btnCantidad"
        onclick="copiarDato(
          'cantidad',
          'btnCantidad',
          'Cantidad'
        )"
      >
        📋 COPIAR CANTIDAD
      </button>

    </div>



    <!-- =====================================================
         UNIDAD DE MEDIDA
         ===================================================== -->

    <div
      class="campo"
      id="campoUnidad"
    >

      <div class="titulo">
        📏 UNIDAD DE MEDIDA
      </div>

      <div
        class="valor"
        id="unidad"
      >
        -
      </div>

      <button
        id="btnUnidad"
        onclick="copiarDato(
          'unidad',
          'btnUnidad',
          'Unidad de medida'
        )"
      >
        📋 COPIAR UNIDAD
      </button>

    </div>



    <!-- =====================================================
         PRECIO
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        💰 PRECIO UNITARIO
      </div>

      <div
        class="valor"
        id="precio"
      >
        -
      </div>

      <button
        id="btnPrecio"
        onclick="copiarDato(
          'precio',
          'btnPrecio',
          'Precio unitario'
        )"
      >
        📋 COPIAR PRECIO
      </button>

    </div>



    <!-- =====================================================
         SUBTOTAL
         ===================================================== -->

    <div class="total">

      Total de la línea:

      <strong id="subtotal">
        S/ 0.00
      </strong>

    </div>


  </div>



  <script>


    // =========================================================
    // RECIBIR DATOS DESDE APPSHEET
    // =========================================================

    const parametros =
      new URLSearchParams(
        window.location.search
      );


    const descripcion =
      parametros.get("descripcion") || "";


    const cantidad =
      parametros.get("cantidad") || "";


    const precio =
      parametros.get("precio") || "";


    const unidad =
      parametros.get("unidad") || "";


    const subtotal =
      parametros.get("subtotal") || "";



    // =========================================================
    // NORMALIZAR UNIDAD
    // =========================================================

    const unidadLimpia =
      String(unidad)
        .trim()
        .toUpperCase();



    // =========================================================
    // MOSTRAR DESCRIPCIÓN
    // =========================================================

    document
      .getElementById("descripcion")
      .textContent =
      descripcion
        ? descripcion
        : "Sin descripción";



    // =========================================================
    // MOSTRAR CANTIDAD
    // =========================================================

    document
      .getElementById("cantidad")
      .textContent =
      cantidad
        ? cantidad
        : "Sin cantidad";



    // =========================================================
    // MOSTRAR / OCULTAR UNIDAD
    // =========================================================

    const campoUnidad =
      document.getElementById(
        "campoUnidad"
      );


    /*
      SI:

      1. unidad está vacía
      O
      2. unidad es "UNIDAD"

      ENTONCES OCULTAMOS TODA LA SECCIÓN.
    */


    if (
      unidadLimpia === "" ||
      unidadLimpia === "UNIDAD"
    ) {

      campoUnidad.style.display = "none";

    }

    else {

      document
        .getElementById("unidad")
        .textContent =
        unidad;

    }



    // =========================================================
    // MOSTRAR PRECIO
    // =========================================================

    document
      .getElementById("precio")
      .textContent =
      precio
        ? "S/ " + formatearPrecio(precio)
        : "Sin precio";



    // =========================================================
    // MOSTRAR SUBTOTAL
    // =========================================================

    document
      .getElementById("subtotal")
      .textContent =
      subtotal
        ? "S/ " + formatearPrecio(subtotal)
        : "S/ 0.00";



    // =========================================================
    // FORMATEAR PRECIO
    // =========================================================

    function formatearPrecio(valor) {

      const numero =
        Number(
          String(valor)
            .replace(",", ".")
        );


      if (
        isNaN(numero)
      ) {

        return valor;

      }


      return numero.toFixed(2);

    }



    // =========================================================
    // COPIAR DATO
    // =========================================================

    async function copiarDato(
      tipo,
      botonId,
      nombreDato
    ) {


      let contenido = "";



      // =======================================================
      // DESCRIPCIÓN
      // =======================================================

      if (
        tipo === "descripcion"
      ) {

        contenido =
          String(descripcion);

      }



      // =======================================================
      // CANTIDAD
      // =======================================================

      if (
        tipo === "cantidad"
      ) {

        contenido =
          String(cantidad);

      }



      // =======================================================
      // UNIDAD
      // =======================================================

      if (
        tipo === "unidad"
      ) {


        // No permitir copiar UNIDAD

        if (
          unidadLimpia === "UNIDAD"
        ) {

          return;

        }


        // No permitir copiar vacío

        if (
          unidadLimpia === ""
        ) {

          return;

        }


        contenido =
          String(unidad);

      }



      // =======================================================
      // PRECIO
      // =======================================================

      if (
        tipo === "precio"
      ) {

        contenido =
          String(
            formatearPrecio(precio)
          );

      }



      // =======================================================
      // VALIDAR CONTENIDO
      // =======================================================

      if (
        !contenido ||
        contenido.trim() === ""
      ) {

        mostrarError(
          "No hay información para copiar."
        );

        return;

      }



      // =======================================================
      // OBTENER BOTÓN
      // =======================================================

      const boton =
        document.getElementById(
          botonId
        );



      // =======================================================
      // EVITAR COPIAR DOS VECES
      // =======================================================

      if (
        boton.classList.contains(
          "copiado"
        )
      ) {

        return;

      }



      // =======================================================
      // INTENTO 1
      // CLIPBOARD API
      // =======================================================

      try {

        await navigator.clipboard.writeText(
          contenido
        );


        marcarComoCopiado(
          boton,
          nombreDato
        );


        return;

      }

      catch (error) {

        console.log(
          "Clipboard API no disponible:",
          error
        );

      }



      // =======================================================
      // INTENTO 2
      // MÉTODO ALTERNATIVO
      // =======================================================

      try {


        const textarea =
          document.createElement(
            "textarea"
          );


        textarea.value =
          contenido;


        textarea.style.position =
          "fixed";


        textarea.style.top =
          "0";


        textarea.style.left =
          "-9999px";


        textarea.style.opacity =
          "0";


        document
          .body
          .appendChild(
            textarea
          );


        textarea.focus();


        textarea.select();


        const resultado =
          document.execCommand(
            "copy"
          );


        document
          .body
          .removeChild(
            textarea
          );


        if (
          resultado
        ) {


          marcarComoCopiado(
            boton,
            nombreDato
          );


        }

        else {


          mostrarError(
            "El navegador no permitió copiar " +
            nombreDato +
            "."
          );


        }


      }

      catch (error) {


        console.log(
          "Error al copiar:",
          error
        );


        mostrarError(
          "No se pudo copiar " +
          nombreDato +
          "."
        );


      }

    }



    // =========================================================
    // MARCAR COMO COPIADO
    // =========================================================

    function marcarComoCopiado(
      boton,
      nombreDato
    ) {


      boton.textContent =
        "✅ COPIADO";


      boton.classList.add(
        "copiado"
      );


      boton.disabled =
        true;


      const estado =
        document.getElementById(
          "estadoGeneral"
        );


      estado.textContent =
        "✅ " +
        nombreDato +
        " copiado correctamente.";


      estado.style.background =
        "#dff6e5";


      estado.style.color =
        "#137333";

    }



    // =========================================================
    // MOSTRAR ERROR
    // =========================================================

    function mostrarError(
      mensaje
    ) {


      const estado =
        document.getElementById(
          "estadoGeneral"
        );


      estado.textContent =
        "❌ " +
        mensaje;


      estado.style.background =
        "#fde7e9";


      estado.style.color =
        "#b3261e";

    }


  </script>


</body>

</html>
