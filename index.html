<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Copiar datos del producto</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 550px;
      margin: 30px auto;
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-top: 0;
      margin-bottom: 25px;
    }

    .campo {
      margin-bottom: 20px;
      padding: 18px;
      background: #f8f9fa;
      border-radius: 12px;
      border: 1px solid #e2e5e8;
    }

    .titulo {
      font-size: 15px;
      font-weight: bold;
      color: #666;
      margin-bottom: 8px;
    }

    .valor {
      font-size: 19px;
      font-weight: bold;
      margin-bottom: 14px;
      word-wrap: break-word;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #1976d2;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1565c0;
    }

    button:active {
      transform: scale(0.98);
    }

    button.copiado {
      background: #2e7d32;
    }

    .estado-general {
      text-align: center;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #f1f3f5;
      color: #555;
    }

    .exito {
      background: #dff6e5;
      color: #137333;
    }

    .error {
      background: #fde7e9;
      color: #b3261e;
    }

    .total {
      text-align: center;
      margin-top: 10px;
      padding: 15px;
      background: #fff8e1;
      border-radius: 10px;
      font-size: 16px;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>📋 Copiar datos del producto</h1>

    <div id="estadoGeneral" class="estado-general">
      Selecciona qué dato quieres copiar.
    </div>


    <!-- =====================================================
         DESCRIPCIÓN
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        📦 DESCRIPCIÓN
      </div>

      <div class="valor" id="descripcion">
        -
      </div>

      <button
        id="btnDescripcion"
        onclick="copiarDato('descripcion', 'btnDescripcion', 'Descripción')">

        📋 COPIAR DESCRIPCIÓN

      </button>

    </div>


    <!-- =====================================================
         CANTIDAD
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        🔢 CANTIDAD
      </div>

      <div class="valor" id="cantidad">
        -
      </div>

      <button
        id="btnCantidad"
        onclick="copiarDato('cantidad', 'btnCantidad', 'Cantidad')">

        📋 COPIAR CANTIDAD

      </button>

    </div>


    <!-- =====================================================
         PRECIO UNITARIO
         ===================================================== -->

    <div class="campo">

      <div class="titulo">
        💰 PRECIO UNITARIO
      </div>

      <div class="valor" id="precio">
        -
      </div>

      <button
        id="btnPrecio"
        onclick="copiarDato('precio', 'btnPrecio', 'Precio unitario')">

        📋 COPIAR PRECIO

      </button>

    </div>


    <!-- =====================================================
         SUBTOTAL
         ===================================================== -->

    <div class="total">

      Total de la línea:
      <strong id="subtotal">S/ 0.00</strong>

    </div>

  </div>


  <script>

    // =========================================================
    // RECIBIR INFORMACIÓN DESDE APPSHEET
    // =========================================================

    const parametros =
      new URLSearchParams(window.location.search);


    const descripcion =
      parametros.get("descripcion") || "";

    const cantidad =
      parametros.get("cantidad") || "";

    const precio =
      parametros.get("precio") || "";

    const subtotal =
      parametros.get("subtotal") || "";


    // =========================================================
    // MOSTRAR INFORMACIÓN
    // =========================================================

    document.getElementById("descripcion").textContent =
      descripcion || "Sin descripción";

    document.getElementById("cantidad").textContent =
      cantidad || "Sin cantidad";

    document.getElementById("precio").textContent =
      precio ? "S/ " + precio : "Sin precio";

    document.getElementById("subtotal").textContent =
      subtotal ? "S/ " + subtotal : "S/ 0.00";


    // =========================================================
    // COPIAR UN DATO
    // =========================================================

    async function copiarDato(
      elemento,
      botonId,
      nombreDato
    ) {

      let contenido = "";


      // -------------------------------------------------------
      // Determinar qué dato copiar
      // -------------------------------------------------------

      if (elemento === "descripcion") {

        contenido = descripcion;

      }

      else if (elemento === "cantidad") {

        contenido = cantidad;

      }

      else if (elemento === "precio") {

        contenido = precio;

      }


      // -------------------------------------------------------
      // Comprobar que exista
      // -------------------------------------------------------

      if (!contenido.trim()) {

        mostrarError(
          nombreDato + " no disponible."
        );

        return;

      }


      // -------------------------------------------------------
      // Intentar copiar
      // -------------------------------------------------------

      try {

        await navigator.clipboard.writeText(contenido);

        mostrarCopiado(
          botonId,
          nombreDato
        );

        return;

      }

      catch (error) {

        console.log(
          "Clipboard API bloqueada:",
          error
        );

      }


      // -------------------------------------------------------
      // Método alternativo
      // -------------------------------------------------------

      try {

        const textarea =
          document.createElement("textarea");

        textarea.value = contenido;

        textarea.style.position = "fixed";
        textarea.style.left = "-9999px";

        document.body.appendChild(textarea);

        textarea.focus();

        textarea.select();

        textarea.setSelectionRange(
          0,
          textarea.value.length
        );

        const resultado =
          document.execCommand("copy");

        document.body.removeChild(textarea);


        if (resultado) {

          mostrarCopiado(
            botonId,
            nombreDato
          );

        }

        else {

          mostrarError(
            "No se pudo copiar " + nombreDato
          );

        }

      }

      catch (error) {

        mostrarError(
          "No se pudo copiar " + nombreDato
        );

      }

    }


    // =========================================================
    // MOSTRAR QUE SE COPIÓ
    // =========================================================

    function mostrarCopiado(
      botonId,
      nombreDato
    ) {

      const boton =
        document.getElementById(botonId);

      const estado =
        document.getElementById("estadoGeneral");


      boton.textContent =
        "✅ COPIADO";

      boton.classList.add("copiado");


      estado.textContent =
        "✅ " + nombreDato + " copiado correctamente.";

      estado.className =
        "estado-general exito";

    }


    // =========================================================
    // MOSTRAR ERROR
    // =========================================================

    function mostrarError(mensaje) {

      const estado =
        document.getElementById("estadoGeneral");

      estado.textContent =
        "❌ " + mensaje;

      estado.className =
        "estado-general error";

    }

  </script>

</body>

</html>
