<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Copiar productos</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
      background: white;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    .status {
      text-align: center;
      margin: 15px 0;
      padding: 12px;
      border-radius: 10px;
      background: #f1f3f5;
      color: #555;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      resize: vertical;
      padding: 15px;
      font-size: 16px;
      line-height: 1.5;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #1976d2;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    button:hover {
      background: #1565c0;
    }

    .success {
      background: #dff6e5;
      color: #137333;
    }

    .error {
      background: #fde7e9;
      color: #b3261e;
    }

    .info {
      margin-top: 15px;
      text-align: center;
      color: #666;
      font-size: 13px;
    }
  </style>

</head>

<body>

  <div class="container">

```
<h1>📋 Copiar productos</h1>

<div id="status" class="status">
  Preparando productos...
</div>

<textarea id="productos" readonly></textarea>

<button id="copiarBtn" onclick="copiarProductos()">
  📋 COPIAR PRODUCTOS
</button>

<div class="info">
  Después de copiar, puedes volver a AppSheet y pegar el contenido donde lo necesites.
</div>
```

  </div>

  <script>

    // ---------------------------------------------------------
    // Obtener el parámetro "texto" enviado desde AppSheet
    // ---------------------------------------------------------

    const parametros = new URLSearchParams(window.location.search);

    const texto = parametros.get("texto") || "";

    const textarea = document.getElementById("productos");
    const status = document.getElementById("status");


    // ---------------------------------------------------------
    // Mostrar productos
    // ---------------------------------------------------------

    if (texto.trim() !== "") {

      textarea.value = texto;

      status.textContent =
        "Se encontraron los productos. Pulsa COPIAR PRODUCTOS.";

    } else {

      status.textContent =
        "No se recibieron productos.";

    }


    // ---------------------------------------------------------
    // Copiar al portapapeles
    // ---------------------------------------------------------

    async function copiarProductos() {

      const contenido = textarea.value;

      if (!contenido.trim()) {

        status.textContent = "No hay productos para copiar.";
        status.className = "status error";

        return;
      }


      try {

        // Método moderno
        await navigator.clipboard.writeText(contenido);

        mostrarExito();

      } catch (error) {

        // Método alternativo para navegadores que no
        // permiten Clipboard API
        try {

          textarea.removeAttribute("readonly");
          textarea.select();
          textarea.setSelectionRange(0, 999999);

          const resultado = document.execCommand("copy");

          textarea.setAttribute("readonly", true);

          if (resultado) {

            mostrarExito();

          } else {

            mostrarError();

          }

        } catch (errorAlternativo) {

          mostrarError();

        }

      }

    }


    // ---------------------------------------------------------
    // Mensaje de éxito
    // ---------------------------------------------------------

    function mostrarExito() {

      status.textContent =
        "✅ ¡Productos copiados al portapapeles!";

      status.className = "status success";

      const boton = document.getElementById("copiarBtn");

      boton.textContent = "✅ COPIADO";

      setTimeout(function() {

        boton.textContent = "📋 COPIAR PRODUCTOS";

      }, 2500);

    }


    // ---------------------------------------------------------
    // Mensaje de error
    // ---------------------------------------------------------

    function mostrarError() {

      status.textContent =
        "No se pudo copiar automáticamente. Selecciona el texto y copia manualmente.";

      status.className = "status error";

    }

  </script>

</body>
</html>
